name: radio-probe
on:
  push:
    branches: ['probe/**']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://de1.api.radio-browser.info/json/stations/byname/joe?countrycode=NL&limit=50" | python3 -c "
          import json,sys
          for s in json.load(sys.stdin):
            if s['countrycode']=='NL': print('RB',s['name'],'|',s['url'],'|',s['url_resolved'],'|',s['codec'],s['bitrate'],s['lastcheckok'])
          " || true
          i=0
          for u in https://audio-streaming.joe.nl/Joe_nl.mp3 https://audio-streaming.joe.nl/JOE_nl_live.mp3 https://audio-streaming.joe.nl/Joe_nl_live.mp3 https://audio-streaming.joe.nl/JOE_nl_live_96.mp3 https://audio-streaming.joe.nl/Joe_nl_live_96.mp3 https://audio-streaming.joe.nl/joe_nl_live.mp3 https://audio-streaming.qmusic.nl/JOE_nl_live.mp3 https://audio-streaming.qmusic.nl/Joe_nl_live.mp3 https://audio-streaming.qmusic.nl/Joe_nl_1_96.mp3 https://icecast-qmusicnl-cdp.triple-it.nl/Joe_nl_1.mp3 https://icecast-qmusicnl-cdp.triple-it.nl/Joe_nl_1_192.mp3 https://stream.joe.nl/joe/aachigh https://stream.joe.nl/joe/aac ; do
            i=$((i+1)); r=$(curl -sL -D /tmp/h$i -o /tmp/s$i -w '%{http_code} %{content_type} %{url_effective}' --max-time 5 "$u" || true); echo "$u => $r size=$(stat -c%s /tmp/s$i 2>/dev/null) head=$(head -c 4 /tmp/s$i | xxd -p)"; done
