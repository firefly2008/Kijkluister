name: EPG probe
on:
  push:
    branches: ['probe/**']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Bronnen testen
        shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) Kijkluister-probe'
          hdr() { echo "=== $1"; curl -s -m 25 -A "$UA" -o /tmp/o -D /tmp/h -w "http %{http_code} %{size_download} bytes %{content_type}\n" "$1"; head -c 400 /tmp/o | tr -d '\r' | head -c 400; echo; }
          for u in \
            https://www.open-epg.com/files/netherlands.xml.gz \
            https://epgshare01.online/epgshare01/epg_ripper_NL1.xml.gz \
            https://tvprofil.net/xmltv/ \
            https://www.tvgids.nl/ \
            https://www.rtl.nl/ \
            https://www.rtlxl.nl/ \
            https://www.nporadio2.nl/api/broadcasts \
            https://www.nporadio2.nl/api/tracks \
            https://www.nporadio1.nl/api/broadcasts \
            https://api.nporadio.nl/graphql \
            https://backstage-api.npo.nl/ \
            https://backstage-docs.npo.nl/ ; do hdr "$u"; done
          for f in open-epg epgshare; do :; done
          echo "=== RTL in open-epg"
          curl -s -m 60 -A "$UA" https://www.open-epg.com/files/netherlands.xml.gz -o /tmp/oe.gz; ls -l /tmp/oe.gz; gunzip -c /tmp/oe.gz 2>/dev/null > /tmp/oe.xml; wc -c /tmp/oe.xml; grep -o '<channel id="[^"]*"' /tmp/oe.xml | grep -i 'rtl\|npo' | head -30; for c in $(grep -o '<channel id="[^"]*"' /tmp/oe.xml | grep -i 'rtl' | sed 's/.*id="//;s/"//'); do echo "$c programmes: $(grep -c "channel=\"$c\"" /tmp/oe.xml)"; done
          echo "=== RTL in epgshare"
          curl -s -m 90 -A "$UA" https://epgshare01.online/epgshare01/epg_ripper_NL1.xml.gz -o /tmp/es.gz; ls -l /tmp/es.gz; gunzip -c /tmp/es.gz 2>/dev/null > /tmp/es.xml; wc -c /tmp/es.xml; grep -o '<channel id="[^"]*"' /tmp/es.xml | grep -i 'rtl' | head; for c in $(grep -o '<channel id="[^"]*"' /tmp/es.xml | grep -i 'rtl' | sed 's/.*id="//;s/"//'); do echo "$c programmes: $(grep -c "channel=\"$c\"" /tmp/es.xml)"; done
          grep -m3 '<programme' /tmp/es.xml | cut -c1-300
