# Bouwt de installer in de cloud (geen lokale toolchain nodig).
# Zet deze map in een GitHub-repo -> Actions -> "Windows installer" -> download het artifact.
name: Windows installer
on:
  push:
    branches: ['**']
  workflow_dispatch:

# Nodig om bij een versie-branch (release/x.y.z) de installer als Release te bewaren
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Qt installeren
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Bouwen + installer maken
        shell: pwsh
        run: |
          # Branch release/2.0.0 bepaalt het versienummer; gewone pushes heten "dev"
          $version = if ($env:GITHUB_REF_NAME -like 'release/*') { $env:GITHUB_REF_NAME.Substring(8) } else { 'dev' }
          "BIGSCREEN_VERSION=$version" >> $env:GITHUB_ENV
          .\scripts\build-installer.ps1 -QtDir "$env:QT_ROOT_DIR" -VcpkgRoot "$env:VCPKG_INSTALLATION_ROOT" -Version $version
      - name: Rooktest (start de app op de runner)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $log = "$env:LOCALAPPDATA\BigscreenHost\bigscreen-host.log"
          # Testbibliotheek: lege videobestanden met namen zoals ze in het echt voorkomen
          $films = "$env:RUNNER_TEMP\media\Films"; $series = "$env:RUNNER_TEMP\media\Series"
          New-Item -ItemType Directory -Force "$films\The.Matrix.1999.1080p.BluRay.x264", "$series\Westworld (2016)\Season 1", "$series\Breaking Bad\Seizoen 2" | Out-Null
          foreach ($f in "$films\The.Matrix.1999.1080p.BluRay.x264\The.Matrix.1999.1080p.BluRay.x264.mkv", "$films\Inception (2010).mkv",
                         "$films\Amelie.2001.DVDRip.XviD.avi", "$series\Westworld (2016)\Season 1\Westworld.S01E01.720p.mkv",
                         "$series\Westworld (2016)\Season 1\Westworld.S01E02.720p.mkv", "$series\Breaking Bad\Seizoen 2\Breaking.Bad.2x03.mp4") {
            New-Item -ItemType File -Force $f | Out-Null
          }
          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\BigscreenHost" | Out-Null
          "[library]`r`nmoviesFolder=$($films -replace '\\','/')`r`nshowsFolder=$($series -replace '\\','/')`r`n" | Set-Content "$env:LOCALAPPDATA\BigscreenHost\settings.ini"
          # Gids-test: een paar echte zenders (iptv-org) met een eigen XMLTV-gids (gzip) rond dit moment
          $tv = "$env:RUNNER_TEMP\tv"; New-Item -ItemType Directory -Force $tv | Out-Null
          $lines = (Invoke-WebRequest -UseBasicParsing https://iptv-org.github.io/iptv/countries/nl.m3u).Content -split "`n" | ForEach-Object { $_.Trim() }
          $guideUrl = "file:///" + ("$tv\guide.xml.gz" -replace '\\','/')
          $m3u = @("#EXTM3U url-tvg=`"$guideUrl`""); $n = 0
          for ($i = 0; $i -lt $lines.Count -and $n -lt 6; $i++) {
            if ($lines[$i] -like '#EXTINF*') {
              $url = ($lines[($i+1)..($i+4)] | Where-Object { $_ -and -not $_.StartsWith('#') } | Select-Object -First 1)
              $n++; $m3u += ($lines[$i] -replace ' tvg-id="[^"]*"', '') -replace '^#EXTINF:-1', "#EXTINF:-1 tvg-id=`"ch$n`""; $m3u += $url
            }
          }
          $m3u -join "`r`n" | Set-Content -Encoding UTF8 "$tv\test.m3u"
          $now = [DateTime]::UtcNow; $start = $now.Date.AddHours($now.Hour - 1)
          $titles = 'Journaal', 'Het Weer', 'Natuur in Nederland', 'Koken met Kim', 'De Avondshow', 'Documentaire: De Noordzee', 'Sportnieuws', 'Filmavond'
          $x = @('<?xml version="1.0" encoding="UTF-8"?>', '<tv>')
          for ($c = 1; $c -le 6; $c++) {
            $x += "<channel id=`"ch$c`"><display-name>Zender $c</display-name></channel>"
            for ($k = 0; $k -lt 16; $k++) {
              $s = $start.AddMinutes(30 * $k); $e = $s.AddMinutes(30); $t = $titles[($k + $c) % $titles.Count]
              $x += "<programme start=`"$($s.ToString('yyyyMMddHHmmss')) +0000`" stop=`"$($e.ToString('yyyyMMddHHmmss')) +0000`" channel=`"ch$c`"><title>$t</title><desc>Uitgebreide beschrijving van $t op zender $c. Hier staat wat er in deze uitzending te zien is, wie er meedoen en waarom het de moeite waard is om te kijken.</desc><category>Informatief</category></programme>"
            }
          }
          $x += '</tv>'
          $bytes = [Text.Encoding]::UTF8.GetBytes($x -join "`n")
          $fs = [IO.File]::Create("$tv\guide.xml.gz"); $gz = New-Object IO.Compression.GZipStream($fs, [IO.Compression.CompressionMode]::Compress)
          $gz.Write($bytes, 0, $bytes.Length); $gz.Close(); $fs.Close()
          $env:BIGSCREEN_TEST_M3U = "$tv\test.m3u"
          Get-Content "$tv\test.m3u"
          foreach ($mode in 'home', 'podcasts', 'moveask', 'library', 'iptvbar', 'iptvepg', 'addtile') {
            $env:BIGSCREEN_SELFTEST = $mode
            $p = Start-Process dist\Kijkluister.exe -PassThru
            Start-Sleep 14
            # Schermafdruk als base64 in het log, zodat het resultaat te bekijken is
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen(0, 0, 0, 0, $bmp.Size)
            $bmp.Save("$env:RUNNER_TEMP\shot.png", [System.Drawing.Imaging.ImageFormat]::Png)
            "SHOT-BEGIN-$mode"; [Convert]::ToBase64String([IO.File]::ReadAllBytes("$env:RUNNER_TEMP\shot.png"), 'InsertLineBreaks'); "SHOT-END"
            if ($p.HasExited) { "RESULT: EXITED code {0} (0x{0:X8})" -f $p.ExitCode } else { "RESULT: RUNNING"; Stop-Process -Id $p.Id -Force }
            if (Test-Path $log) { "--- log ---"; Get-Content $log } else { "NO LOG FILE" }
            if (-not (Test-Path $log) -or -not (Select-String -Path $log -Pattern "Window shown" -Quiet)) { throw "Rooktest mislukt: venster niet getoond" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Kijkluister-setup
          path: out/*.exe
      # Een branch release/x.y.z wordt Release vx.y.z: die blijft bewaard naast de andere versies
      - name: Release maken
        if: startsWith(github.ref, 'refs/heads/release/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BIGSCREEN_VERSION }}
          name: Kijkluister ${{ env.BIGSCREEN_VERSION }}
          target_commitish: ${{ github.sha }}
          files: out/*.exe
          generate_release_notes: true
