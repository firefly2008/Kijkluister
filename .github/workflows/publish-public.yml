# Bestaande release (bv. v4.0.0) alsnog in de openbare repo kijkluister-releases zetten,
# zonder opnieuw te bouwen. Starten: push naar branch publish/<versie>, bv. publish/4.0.0
name: Openbaar publiceren
on:
  push:
    branches: ['publish/**']
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Installer ophalen en publiceren
        env:
          SRC_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then echo "::error::Geheim RELEASES_TOKEN ontbreekt in deze repo"; exit 1; fi
          v="${GITHUB_REF_NAME#publish/}"; tag="v$v"
          GH_TOKEN="$SRC_TOKEN" gh release download "$tag" -R "$GITHUB_REPOSITORY" -p '*-x64-setup.exe' -D out
          if ! gh api repos/firefly2008/kijkluister-releases/contents/README.md >/dev/null 2>&1; then
            printf '# Kijkluister\n\nKijkluister voor Windows 10/11: tv-startscherm met apps, live tv, radio, films en series.\n\nDownload de nieuwste installer bij [Releases](https://github.com/firefly2008/kijkluister-releases/releases/latest).\n' > README.md
            gh api -X PUT repos/firefly2008/kijkluister-releases/contents/README.md -f message=README -f content="$(base64 -w0 README.md)" >/dev/null
          fi
          gh release delete "$tag" -R firefly2008/kijkluister-releases --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" out/*.exe -R firefly2008/kijkluister-releases --title "Kijkluister $v" \
            --notes "Kijkluister $v voor Windows 10/11 (x64). Download de installer hieronder; Kijkluister werkt zichzelf daarna stil bij." --latest
          echo "Gepubliceerd: https://github.com/firefly2008/kijkluister-releases/releases/tag/$tag"
